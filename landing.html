<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلیمەت</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #FFF1F8, #FFF8D9, #EAF7FF, #F7E9FF);
    background-size: 400% 400%;
    animation: bgMove 12s ease-in-out infinite;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    z-index: 0;
    filter: blur(4px);
    opacity: 0.55;
    animation: floatBlob 10s ease-in-out infinite;
  }

  body::before {
    top: -140px;
    right: -120px;
    background: radial-gradient(circle, #FFB6D9, #FFD6EA, transparent 70%);
  }

  body::after {
    bottom: -150px;
    left: -130px;
    background: radial-gradient(circle, #CDEBFF, #EAD7FF, transparent 70%);
    animation-delay: -4s;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(25px, 18px) scale(1.08); }
  }

  .shape {
    position: fixed;
    z-index: 0;
    font-size: 28px;
    opacity: 0.45;
    animation: floatShape 7s ease-in-out infinite;
    pointer-events: none;
  }

  .shape.one { top: 13%; left: 14%; animation-delay: 0s; }
  .shape.two { top: 20%; right: 12%; animation-delay: -2s; }
  .shape.three { bottom: 18%; left: 18%; animation-delay: -4s; }
  .shape.four { bottom: 20%; right: 16%; animation-delay: -1s; }
  .shape.five { top: 50%; left: 7%; animation-delay: -3s; }
  .shape.six { top: 55%; right: 7%; animation-delay: -5s; }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 104px;
    height: 104px;
    object-fit: cover;
    border-radius: 28px;
    margin-bottom: 18px;
    box-shadow: 0 14px 30px rgba(255, 102, 178, 0.22);
    animation: logoBounce 3.5s ease-in-out infinite;
  }

  @keyframes logoBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-7px) scale(1.03); }
  }

  h1 {
    font-size: 52px;
    font-weight: 900;
    color: #2C2C2A;
    letter-spacing: -1px;
    margin-bottom: 12px;
    direction: rtl;
  }

  .tagline {
    font-size: 18px;
    color: #5F5E5A;
    margin-bottom: 44px;
    line-height: 1.8;
    max-width: 350px;
    font-weight: 500;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 330px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 28px;
    border-radius: 24px;
    text-decoration: none;
    font-size: 17px;
    font-weight: 700;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.10);
  }

  .btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .btn-ios {
    background: #1C1C1E;
    color: #FFFFFF;
  }

  .btn-android {
    background: #01875F;
    color: #FFFFFF;
  }

  .btn svg {
    width: 25px;
    height: 25px;
    flex-shrink: 0;
  }

  .btn-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .btn-sub {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.82;
    margin-bottom: 2px;
  }

  .btn-main {
    font-size: 17px;
    font-weight: 900;
  }

  .footer {
    margin-top: 46px;
    font-size: 13px;
    color: #8E8A82;
    font-weight: 600;
  }
</style>
</head>

<body>

<span class="shape one">⭐</span>
<span class="shape two">💗</span>
<span class="shape three">🌈</span>
<span class="shape four">✨</span>
<span class="shape five">🎈</span>
<span class="shape six">🌸</span>

<div class="content">

  <img src="Logo.png" alt="بلیمەت" class="logo">

  <h1>بلیمەت</h1>

  <p class="tagline">یارییەکی فێرکاری و بەسوود بۆ منداڵان!</p>

  <div class="buttons">

    <a href="https://apps.apple.com/us/app/%D8%A8%D9%84%DB%8C%D9%85%DB%95%D8%AA/id6758273850" class="btn btn-ios">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>

      <div class="btn-text">
        <span class="btn-sub">بۆ ئایفۆن و ئایپاد</span>
        <span class="btn-main">دایبگرە لە ئاپ ستۆر</span>
      </div>
    </a>

    <a href="https://play.google.com/store/apps/details?id=com.helanaymndalan.blimat" class="btn btn-android">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.18 23.76c.3.17.64.22.99.14l12.12-6.98-2.54-2.54-10.57 9.38zM.5 1.48C.19 1.8 0 2.3 0 2.96v18.08c0 .66.19 1.16.51 1.48l.08.07 10.12-10.12v-.24L.58 1.41.5 1.48zM20.37 10.43l-2.9-1.68-2.85 2.85 2.85 2.85 2.91-1.68c.83-.48.83-1.26-.01-1.74zM3.18.24l12.12 6.98-2.54 2.54L2.19.38C2.54.3 2.88.35 3.18.24z"/>
      </svg>

      <div class="btn-text">
        <span class="btn-sub">بۆ مۆبایل و تابلێتی ئەندرۆید</span>
        <span class="btn-main">دایبگرە لە گووگڵ پلەی</span>
      </div>
    </a>

  </div>

  <p class="footer">بلیمەت بۆ منداڵان دروستکراوە</p>

</div>

</body>
</html>
